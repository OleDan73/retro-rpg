<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Michael's Quest</title>
  <meta name="description" content="A tiny retro RPG: help Michael clear the slimes from Whisper Woods.">
  <meta name="theme-color" content="#140c1c">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Michael's Quest">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="wrap">
    <canvas id="game" width="240" height="160" aria-label="Michael's Quest game screen"></canvas>

    <div id="controls" aria-label="Touch controls">
      <div class="dpad">
        <button type="button" data-btn="up" class="up" aria-label="Up">&#9650;</button>
        <button type="button" data-btn="left" class="left" aria-label="Left">&#9664;</button>
        <button type="button" data-btn="right" class="right" aria-label="Right">&#9654;</button>
        <button type="button" data-btn="down" class="down" aria-label="Down">&#9660;</button>
      </div>
      <div class="ab">
        <button type="button" data-btn="b" class="bbtn" aria-label="Menu">B</button>
        <button type="button" data-btn="a" class="abtn" aria-label="Action">A</button>
      </div>
    </div>

    <div id="bar">
      <span class="hint">ARROWS/WASD: MOVE &middot; SPACE: TALK/OK &middot; X: MENU</span>
      <button type="button" id="install" hidden>INSTALL</button>
      <button type="button" id="mute">SOUND: ON</button>
    </div>
  </main>
  <script src="game.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
